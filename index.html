<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Bubnovagaraz</title>
</head>
<body>

  <div id="stranka1">
    <h2>Bubnová Garáž</h2>
    <p>Zadajte vas kod:</p>
    <input type="number" id="kod_vstup" />
    <br><br>
    <button onclick="prihlasit()">Prihlásiť</button>
    <br><br>
    <p id="chyba" style="color:red;"></p>
  </div>

  <div id="stranka2" style="display:none;">
    <h2>Bubnová Garáž</h2>
    <p>Vaše auto sa nachádza v slote číslo: <b id="cislo_slotu"></b></p>
    <br>
    <button onclick="vyparkovanie()">Vyparkovať</button>
    <br><br>
    <p id="sprava"></p>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const konfig = {
    apiKey: "AIzaSyB_zI46x4fn8_b_qgdFib3KtylPs5D9Kww",
    databaseURL: "https://bubnovagaraz-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "bubnovagaraz",
  };

  const apka = initializeApp(konfig);
  const baza = getDatabase(apka);
  let najdeny_slot = null;

  window.prihlasit = async function() {
    const kod = document.getElementById('kod_vstup').value;
    document.getElementById('chyba').textContent = '';

    if (kod.length != 4) {
      document.getElementById('chyba').textContent = 'Zadajte 4 ciferny kod';
      return;
    }

    const snapshot = await get(ref(baza, 'sloty'));
    const data = snapshot.val();
    najdeny_slot = null;

    for (let klic in data) {
      if (String(data[klic].kod) == String(kod) && data[klic].obsadene == true) {
        najdeny_slot = klic;
        break;
      }
    }

    if (najdeny_slot != null) {
      document.getElementById('cislo_slotu').textContent = najdeny_slot;
      document.getElementById('stranka1').style.display = 'none';
      document.getElementById('stranka2').style.display = 'block';
    } else {
      document.getElementById('chyba').textContent = 'Nespravny kod';
    }
  };

  window.vyparkovanie = async function() {
    if (najdeny_slot == null) return;
    await set(ref(baza, '/akcia'), 'vystup');
    await set(ref(baza, '/akciaSlot'), parseInt(najdeny_slot));
    document.getElementById('sprava').textContent = 'Garaze sa otvara, pockaite pri vchode.';
    document.querySelector('#stranka2 button').disabled = true;
  };
</script>

</body>
</html>
