<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubnová garáž - Admin</title>
  <style>
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1e222b;
      color: #f5f5f5;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
    }

  
    #prihlasenie, #panel {
      background-color: #282c34;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
    }

  
    #panel {
      max-width: 600px;
    }

    h2 {
      margin-top: 0;
      color: #ffffff;
      border-bottom: 2px solid #ff4d4d;
      padding-bottom: 10px;
      font-size: 24px;
    }

    p {
      color: #abb2bf;
      margin: 10px 0 5px 0;
    }


    .heslo-kontajner {
      position: relative;
      width: 100%;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #3e4451;
      border-radius: 6px;
      background-color: #21252b;
      color: #fff;
      font-size: 16px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #ff4d4d;
      outline: none;
    }


    .btn-ukaz-heslo {
      position: absolute;
      right: 12px;
      top: 12px;
      background: none;
      border: none;
      color: #abb2bf;
      cursor: pointer;
      font-size: 14px;
      width: auto;
      padding: 0;
      margin: 0;
    }
    .btn-ukaz-heslo:hover {
      color: #ff4d4d;
      background: none;
    }


    button {
      width: 100%;
      padding: 12px;
      background-color: #ff4d4d;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: #e60000;
    }

    button:active {
      transform: scale(0.98);
    }

    button[onclick="odhlasit()"] {
      background-color: #4b5263;
      margin-top: 20px;
    }
    button[onclick="odhlasit()"]:hover {
      background-color: #3e4451;
    }


    .tabulka-responsivita {
      width: 100%;
      overflow-x: auto;
      margin-top: 15px;
      padding-right: 110px; 
      box-sizing: border-box;
    }

    .tabulka-riadok {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      background-color: #21252b;
      border-radius: 6px;
      padding: 10px;
      border: 1px solid #282c34;
      position: relative;
    }


    .bunka {
      flex: 1;
      padding: 4px 8px;
      font-size: 15px;
      min-width: 60px;
    }
    
    .hlavicka {
      background-color: #3e4451;
      font-weight: bold;
      color: #fff;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.5px;
      border: none;
    }


    .free-range-btn {
      position: absolute;
      left: calc(100% + 15px); 
      width: 95px;
      padding: 6px 10px;
      font-size: 12px;
      background-color: #ff4d4d;
      box-shadow: 0 4px 10px rgba(255, 77, 77, 0.2);
    }

    .free-range-prazdne {
      position: absolute;
      left: calc(100% + 55px);
      color: #5c6370;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="prihlasenie">
    <h2>Admin panel</h2>
    <p>Meno:</p>
    <input type="text" id="meno_vstup" />
    <p>Heslo:</p>
    <div class="heslo-kontajner">
      <input type="password" id="heslo_vstup" />
      <button type="button" class="btn-ukaz-heslo" onclick="toggleHeslo()">👁️</button>
    </div>
    <br>
    <button onclick="prihlasit()">Prihlásiť</button>
    <p id="chyba" style="color:#ff6b6b; font-weight: bold; text-align: center; margin-top: 15px;"></p>
  </div>

  <div id="panel" style="display:none;">
    <h2>Admin panel - prehľad</h2>
    
    <div class="tabulka-responsivita">
      <div class="tabulka-riadok hlavicka">
        <div class="bunka">Slot</div>
        <div class="bunka">Obsadené</div>
        <div class="bunka">Kód</div>
      </div>
      <div id="tabulka"></div>
    </div>

    <button onclick="odhlasit()">Odhlásiť</button>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const konfig = {
    apiKey: "AIzaSyB_zI46x4fn8_b_qgdFib3KtylPs5D9Kww",
    databaseURL: "https://bubnovagaraz-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "bubnovagaraz",
  };

  const apka = initializeApp(konfig);
  const baza = getDatabase(apka);

  window.toggleHeslo = function() {
    const hesloInput = document.getElementById('heslo_vstup');
    const btn = document.querySelector('.btn-ukaz-heslo');
    if (hesloInput.type === 'password') {
      hesloInput.type = 'text';
      btn.textContent = '🙈';
    } else {
      hesloInput.type = 'password';
      btn.textContent = '👁️';
    }
  };

  window.prihlasit = function() {
    const meno = document.getElementById('meno_vstup').value;
    const heslo = document.getElementById('heslo_vstup').value;

    if (meno == "admin1" && heslo == "admin1") {
      document.getElementById('prihlasenie').style.display = 'none';
      document.getElementById('panel').style.display = 'block';
      spusti_sledovanie();
    } else {
      document.getElementById('chyba').textContent = 'Nesprávne meno alebo heslo';
    }
  };

  window.odhlasit = function() {
    document.getElementById('panel').style.display = 'none';
    document.getElementById('prihlasenie').style.display = 'block';
    document.getElementById('meno_vstup').value = '';
    document.getElementById('heslo_vstup').value = '';
  };

  window.vyparkovatAuto = async function(cisloSlotu) {
    if (confirm("Naozaj chcete poslať príkaz na vyparkovanie zo slotu " + cisloSlotu + "?")) {
      await set(ref(baza, '/akcia'), 'vystup');
      await set(ref(baza, '/akciaSlot'), parseInt(cisloSlotu));
    }
  };

  function spusti_sledovanie() {
    onValue(ref(baza, 'sloty'), function(snapshot) {
      const data = snapshot.val();
      const tabulka = document.getElementById('tabulka');
      tabulka.innerHTML = '';

      for (let klic in data) {
        const slot = data[klic];
        
        const riadok = document.createElement('div');
        riadok.className = 'tabulka-riadok';

        const td_slot = document.createElement('div');
        td_slot.className = 'bunka';
        td_slot.textContent = klic;

        const td_obsadene = document.createElement('div');
        td_obsadene.className = 'bunka';
        if (slot.obsadene == true) {
          td_obsadene.textContent = 'ÁNO';
          td_obsadene.style.color = '#ff6b6b';
          td_obsadene.style.fontWeight = 'bold';
        } else {
          td_obsadene.textContent = 'NIE';
          td_obsadene.style.color = '#98c379';
          td_obsadene.style.fontWeight = 'bold';
        }

        const td_kod = document.createElement('div');
        td_kod.className = 'bunka';
        if (slot.kod == "" || slot.kod == null) {
          td_kod.textContent = '-';
        } else {
          td_kod.textContent = slot.kod;
        }

        riadok.appendChild(td_slot);
        riadok.appendChild(td_obsadene);
        riadok.appendChild(td_kod);

        if (slot.obsadene == true) {
          const tlacidlo = document.createElement('button');
          tlacidlo.textContent = 'Vyparkovať';
          tlacidlo.className = 'free-range-btn';
          
          tlacidlo.onclick = function() {
            const cisloSlotu = klic.replace(/[^0-9]/g, ''); 
            window.vyparkovatAuto(cisloSlotu);
          };
          riadok.appendChild(tlacidlo);
        } else {
          const pomlcka = document.createElement('span');
          pomlcka.textContent = '-';
          pomlcka.className = 'free-range-prazdne';
          riadok.appendChild(pomlcka);
        }

        tabulka.appendChild(riadok);
      }
    });
  }
</script>

</body>
</html>
